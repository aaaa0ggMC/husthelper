<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 136 176" width="100%" height="100%" fill="none">
  <defs>
    <!-- 左立柱渐变 -->
    <linearGradient id="pillarLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="30%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- 右立柱渐变 -->
    <linearGradient id="pillarRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- 上阶梯横梁 (Hust) -->
    <linearGradient id="rungTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- 下阶梯横梁 (Helper) -->
    <linearGradient id="rungBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- 立体微投影 -->
    <filter id="floatShadow" x="-20%" y="-15%" width="140%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 纯透明背景：Double H / Ladder 极简主体 -->
  <g filter="url(#floatShadow)">
    <!-- 上横梁 (H1: Hust) -->
    <rect x="8" y="52" width="120" height="22" rx="11" fill="url(#rungTop)"/>

    <!-- 下横梁 (H2: Helper) -->
    <rect x="8" y="102" width="120" height="22" rx="11" fill="url(#rungBottom)"/>

    <!-- 左立柱 -->
    <rect x="8" y="8" width="22" height="160" rx="11" fill="url(#pillarLeft)"/>

    <!-- 右立柱 -->
    <rect x="106" y="8" width="22" height="160" rx="11" fill="url(#pillarRight)"/>

    <!-- 节点微光圆点（象征连接与固定铆钉） -->
    <circle cx="19" cy="63" r="4" fill="#ffffff" opacity="0.95"/>
    <circle cx="117" cy="63" r="4" fill="#ffffff" opacity="0.95"/>
    <circle cx="19" cy="113" r="4" fill="#ffffff" opacity="0.95"/>
    <circle cx="117" cy="113" r="4" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
