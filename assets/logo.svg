<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- 中心背景光晕 -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- 左立柱渐变 -->
    <linearGradient id="pillarLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- 右立柱渐变 -->
    <linearGradient id="pillarRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- 上阶梯横梁 (Hust) -->
    <linearGradient id="rungTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- 下阶梯横梁 (Helper) -->
    <linearGradient id="rungBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- 投影滤镜 -->
    <filter id="subtleDropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="rungGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 图标底板：圆角矩形 -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- 柔和中心光晕 -->
  <circle cx="128" cy="128" r="96" fill="url(#glow)"/>

  <!-- 梯子 / 双 H 主体 (Ladder & Double H) -->
  <g filter="url(#subtleDropShadow)">
    <!-- 上横梁 (H1: Hust) -->
    <rect x="68" y="93" width="120" height="22" rx="11" fill="url(#rungTop)" filter="url(#rungGlow)"/>

    <!-- 下横梁 (H2: Helper) -->
    <rect x="68" y="141" width="120" height="22" rx="11" fill="url(#rungBottom)"/>

    <!-- 左立柱 -->
    <rect x="68" y="48" width="22" height="160" rx="11" fill="url(#pillarLeft)"/>

    <!-- 右立柱 -->
    <rect x="166" y="48" width="22" height="160" rx="11" fill="url(#pillarRight)"/>

    <!-- 阶梯节点连接微光微点（象征节点与互联） -->
    <circle cx="79" cy="104" r="4.5" fill="#f0f9ff" opacity="0.9"/>
    <circle cx="177" cy="104" r="4.5" fill="#f0f9ff" opacity="0.9"/>
    <circle cx="79" cy="152" r="4.5" fill="#e0e7ff" opacity="0.9"/>
    <circle cx="177" cy="152" r="4.5" fill="#e0e7ff" opacity="0.9"/>
  </g>
</svg>
